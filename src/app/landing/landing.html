<div class="landing-container">
  <mat-toolbar class="topbar" color="transparent">
    <div class="logo">
      <mat-icon class="logo-icon">movie</mat-icon>
      <span class="logo-text">JavaFlix</span>
    </div>

    <span class="spacer"></span>

    <button mat-flat-button class="signin-btn" (click)="login()">Sign In</button>
  </mat-toolbar>

  <section class="hero">
    <h1 class="hero-title">
      Unlimited movies, TV <br class="br-md" />
      shows and more
    </h1>
    <p class="hero-caption">Ready to watch? Enter your email to get started.</p>

    <form [formGroup]="landingForm" class="cta" (ngSubmit)="getStarted()" novalidate>
      <mat-form-field appearance="outline" class="email-field">
        <mat-label>Email address</mat-label>
        <input matInput formControlName="email" type="email" required />
        <mat-icon matSuffix>email</mat-icon>
        <mat-error *ngIf="landingForm.get('email')?.hasError('required')">
          Email is required.
        </mat-error>
        <mat-error *ngIf="landingForm.get('email')?.hasError('email')">
          Please enter a valid email address.
        </mat-error>
      </mat-form-field>

      <button mat-flat-button class="cta-btn" type="submit" [disabled]="landingForm.invalid">
        Get Started <mat-icon>arrow_forward</mat-icon>
      </button>
    </form>
  </section>
</div>

<section class="reasons-wrap">
  <h2 class="row-title">Why You Should Choose JavaFlix</h2>

  <div class="reason-grid">
    <mat-card class="reason-card" *ngFor="let reason of reasons">
      <h3>{{ reason.title }}</h3>
      <p>{{ reason.text }}</p>

      <div class="badge">
        <mat-icon>{{ reason.icon }}</mat-icon>
      </div>
    </mat-card>
  </div>
</section>
